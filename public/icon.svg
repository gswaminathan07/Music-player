<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Vinyl Body -->
  <circle cx="256" cy="256" r="200" fill="url(#vinyl)" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Concentric Grooves -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />
  
  <!-- Center Spindle Label -->
  <circle cx="256" cy="256" r="70" fill="#d3e3fd" />
  <circle cx="256" cy="256" r="24" fill="#041e49" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />
  
  <!-- Stylized Play V-Shape in Spindle Label -->
  <path d="M 248 244 L 268 256 L 248 268 Z" fill="#ffffff" />
</svg>
