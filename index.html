<!doctype html>
<html lang="en" style="background-color: #0c0c0e; color: #f4f4f5;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Vettify · Studio Audio Player</title>
    <meta name="description" content="High-fidelity audio player with 10-band parametric equalizer, offline device storage, and local file playback." />
    <meta property="og:title" content="Vettify · Studio Audio Player" />
    <meta property="og:description" content="High-fidelity audio player with 10-band parametric equalizer, offline device storage, and local file playback." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #0c0c0e !important;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }
      @keyframes vettifyPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.8; }
      }
      @keyframes vettifySpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #0c0c0e; color: #f4f4f5;">
    <div id="root">
      <!-- Instant dark studio splash displayed immediately while JS bundle compiles & rehydrates -->
      <div id="studio-preloader" style="min-height: 100vh; background-color: #0c0c0e; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f4f4f5; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="position: relative; margin-bottom: 20px;">
          <div style="width: 64px; height: 64px; border-radius: 50%; background: #141418; border: 2px solid #27272a; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);">
            <div style="width: 24px; height: 24px; border-radius: 50%; background: #ea580c; animation: vettifyPulse 1.8s ease-in-out infinite;"></div>
          </div>
          <div style="position: absolute; inset: -4px; border: 2px solid transparent; border-top-color: #f97316; border-radius: 50%; animation: vettifySpin 1.2s linear infinite;"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
          <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">Vettify</span>
          <span style="font-size: 11px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; color: #f97316; background: rgba(249,115,22,0.12); padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(249,115,22,0.25);">Studio</span>
        </div>
        <p style="color: #71717a; font-size: 12px; margin: 0; font-family: 'JetBrains Mono', monospace;">Connecting Studio Audio Engine...</p>
      </div>
    </div>

    <!-- Pre-bundle Error Catcher & Recovery Failsafe -->
    <script>
      (function() {
        var hasRendered = false;
        var root = document.getElementById('root');
        var observer = new MutationObserver(function() {
          if (root && root.children.length > 0 && !document.getElementById('studio-preloader')) {
            hasRendered = true;
            observer.disconnect();
          }
        });
        if (root) observer.observe(root, { childList: true });

        window.addEventListener('error', function(e) {
          if (!hasRendered) {
            var loader = document.getElementById('studio-preloader');
            if (loader) {
              loader.innerHTML = '<div style="max-width: 340px; padding: 20px; background: #141418; border: 1px solid #27272a; border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.7);"><div style="font-size: 28px; margin-bottom: 10px;">🎵</div><h3 style="margin: 0 0 6px; font-size: 16px; font-weight: 800; color: #fff;">Vettify Studio Audio</h3><p style="color: #a1a1aa; font-size: 12px; margin: 0 0 16px; line-height: 1.5;">Reconnecting to your audio engine & cloud library...</p><button onclick="window.location.reload(true)" style="background: #ea580c; color: white; border: none; padding: 10px 22px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; width: 100%; margin-bottom: 8px;">Reload Studio</button><button onclick="if(window.caches){caches.keys().then(function(k){return Promise.all(k.map(function(c){return caches.delete(c);}));}).then(function(){window.location.reload(true);});}else{window.location.reload(true);}" style="background: transparent; color: #71717a; border: 1px solid #27272a; padding: 8px 16px; border-radius: 10px; font-size: 11px; cursor: pointer; width: 100%;">Clear Cache & Reconnect</button></div>';
            }
          }
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'SW_CACHE_PURGED_RELOAD') {
            window.location.reload();
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update().catch(function() {});
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          }).catch(function(err) {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
